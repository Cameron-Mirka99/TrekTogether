# Amplify Hosting build spec. On every push to a connected branch:
#   1. backend  - deploys the Gen 2 backend (auth, data, functions) for that branch
#                 and writes amplify_outputs.json for the frontend build to use.
#   2. frontend - exports the Expo app as a static web bundle into dist/.
version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 24 && nvm use 24
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - nvm use 24
        - npx expo export --platform web
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
