# Amplify Hosting build spec. On every push to a connected branch:
#   1. backend  - deploys the Gen 2 backend (auth, data, functions) for that branch
#                 and writes amplify_outputs.json for the frontend build to use.
#   2. frontend - exports the Expo app as a static web bundle into dist/.
version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 24 && nvm use 24
        # Using `npm install` instead of `npm ci` because @aws-amplify/data-construct@1.17.7
        # ships a bundled dependency tree that `npm ci` always rejects as out of sync.
        # Switch back to `npm ci` once this is fixed:
        # https://github.com/aws-amplify/amplify-category-api/issues/3537
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - nvm use 24
        - npx expo export --platform web
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
